[servers.host]
command = "/opt/homebrew/bin/deno"
args = ["run", "--no-config", "--node-modules-dir=none", "--allow-write=~/p/agentic-search-bench/research/probes/forgemax/out/calls.log", "--allow-env", "--allow-read", "~/p/agentic-search-bench/research/probes/forgemax/lookup-server.ts", "~/p/agentic-search-bench/research/probes/forgemax/out/calls.log"]
transport = "stdio"
env = { DENO_DIR = "~/p/agentic-search-bench/research/impls/forgemax/deno-dir" }
timeout_secs = 30
circuit_breaker = true

# [sandbox], [sandbox.pool] and [sandbox.stash] copied from forge.toml.example.production at v0.6.1
[sandbox]
timeout_secs = 5
max_heap_mb = 64
max_concurrent = 8
max_tool_calls = 50
execution_mode = "child_process"
max_resource_size_mb = 64
max_ipc_message_size_mb = 65
max_parallel = 8
startup_concurrency = 4

[sandbox.pool]
enabled = true
min_workers = 2
max_workers = 8
max_idle_secs = 60
max_uses = 50

[sandbox.stash]
max_keys = 256
max_value_size_mb = 16
max_total_size_mb = 128
default_ttl_secs = 3600
max_ttl_secs = 86400
max_calls = 100
